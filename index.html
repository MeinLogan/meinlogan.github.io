<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11151a">
  <meta name="description" content="MeinLogan — personal page and socials.">
  <title>meinlogan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main id="profile-card">
    
    <div class="avatar">
      <img src="pfp.png" alt="my pfp">
    </div>

    <h1>meinlogan</h1>
    <p class="bio">i make things and play games</p>

    
    <nav class="links" aria-label="Social links">
      <a class="link" href="https://steamcommunity.com/id/meinlogan/" target="_blank" rel="noopener noreferrer">
        <span class="link-left">
          <img class="social-logo" src="steamwhite.png" alt="">
          <span>Steam</span>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link" href="https://discord.com/users/meinlogan/" target="_blank" rel="noopener noreferrer">
        <span class="link-left">
          <img class="social-logo" src="discordwhite.png" alt="">
          <span>Discord</span>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link" href="https://www.youtube.com/@meinlogan/" target="_blank" rel="noopener noreferrer">
        <span class="link-left">
          <span class="link-icon">▶</span>
          <span>YouTube</span>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link" href="https://www.twitch.tv/meinlogan/" target="_blank" rel="noopener noreferrer">
        <span class="link-left">
          <img class="social-logo" src="twitchwhite.png" alt="">
          <span>Twitch</span>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link" href="https://anilist.co/user/MeinLogan/" target="_blank" rel="noopener noreferrer">
        <span class="link-left">
          <img class="social-logo" src="anilistwhite.png" alt="">
          <span>Anilist</span>
        </span>
        <span class="arrow">↗</span>
      </a>

    </nav>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("snow");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0, height = 0, flakes = [], last = 0;
      const pointer = { x: 0, y: 0 };

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.min(230, Math.floor(width * height / 4700));
        flakes = Array.from({ length: count }, () => makeFlake(true));
      }
      function makeFlake(randomY = false) {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: randomY ? Math.random() * height : -12,
          z: depth,
          r: .45 + depth * 2.1,
          speed: .35 + depth * 1.7,
          drift: (Math.random() - .5) * (.35 + depth * .9),
          phase: Math.random() * Math.PI * 2,
          alpha: .18 + depth * .58
        };
      }
      function draw(time = 0) {
        const dt = Math.min((time - (last || time)) / 16.67, 2);
        last = time;
        ctx.clearRect(0, 0, width, height);
        for (const f of flakes) {
          f.phase += .009 * dt;
          f.y += f.speed * dt;
          f.x += (f.drift + Math.sin(f.phase) * .24 + pointer.x * f.z * .16) * dt;
          if (f.y > height + 12 || f.x < -15 || f.x > width + 15) {
            Object.assign(f, makeFlake(false));
            if (f.x < 0 || f.x > width) f.x = Math.random() * width;
          }
          ctx.beginPath();
          ctx.fillStyle = `rgba(245, 249, 255, ${f.alpha})`;
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
          if (f.z > .72) {
            ctx.strokeStyle = `rgba(235, 244, 255, ${f.alpha * .25})`;
            ctx.lineWidth = f.r * .7;
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            ctx.lineTo(f.x - f.drift * 2, f.y + f.speed * 2.3);
            ctx.stroke();
          }
        }
        if (!reduceMotion) requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", e => {
        pointer.x = (e.clientX / Math.max(width, 1) - .5) * 2;
        pointer.y = (e.clientY / Math.max(height, 1) - .5) * 2;
      }, { passive: true });

      const card = document.getElementById("profile-card");
      if (window.matchMedia("(pointer: fine)").matches && !reduceMotion) {
        window.addEventListener("pointermove", e => {
          const rect = card.getBoundingClientRect();
          const dx = (e.clientX - (rect.left + rect.width / 2)) / rect.width;
          const dy = (e.clientY - (rect.top + rect.height / 2)) / rect.height;
          const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                         e.clientY >= rect.top && e.clientY <= rect.bottom;
          card.style.transform = inside
            ? `perspective(900px) rotateX(${-dy * 3}deg) rotateY(${dx * 3}deg)`
            : "";
        }, { passive: true });
        card.addEventListener("mouseleave", () => { card.style.transform = ""; });
      }

      resize();
      if (reduceMotion) draw(0); else requestAnimationFrame(draw);
    })();
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
